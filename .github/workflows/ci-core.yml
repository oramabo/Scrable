name: ci-core

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'content/**'
      - '.github/workflows/ci-core.yml'
  pull_request:
    paths:
      - 'packages/core/**'
      - 'content/**'
      - '.github/workflows/ci-core.yml'

jobs:
  core:
    name: dart analyze + test (packages/core)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart --version
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test --reporter expanded
